name: Publish release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install Typst 0.15.1 and test tools
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils
          target='x86_64-unknown-linux-musl'
          checksum='a6d077d0a95eed5a2eba715b2dae06be954f624ccbf85758a03f389ded33118c'
          archive="typst-$target.tar.xz"
          curl -fsSL --retry 3 "https://github.com/typst/typst/releases/download/v0.15.1/$archive" -o "/tmp/$archive"
          printf '%s  /tmp/%s\n' "$checksum" "$archive" | sha256sum --check --status -
          tar -xJf "/tmp/$archive" -C /tmp
          sudo install -m 0755 "/tmp/typst-$target/typst" /usr/local/bin/typst
          typst --version
          pdftotext -v || true
      - name: Verify tag and package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(bun -e 'console.log(JSON.parse(await Bun.file("package.json").text()).version)')"
          test "$tag" = "$version"
          bun install --frozen-lockfile
          bunx tsc --noEmit
          bun test
      - name: Build versioned and latest-release assets
        run: |
          archive_name="resume-toolkit-${GITHUB_REF_NAME}.tar.gz"
          archive="$RUNNER_TEMP/$archive_name"
          tar --exclude='./.git' --exclude='./node_modules' --exclude='./graphify-out' -czf "$archive" .
          cp "$archive" "$archive_name"
          sha256sum "$archive_name" > "$archive_name.sha256"
          cp scripts/release.ts release.ts
          sha256sum release.ts > release.ts.sha256
          cp "$archive_name" resume-toolkit.tar.gz
          printf '%s  resume-toolkit.tar.gz\n' "$(sha256sum "$archive_name" | cut -d ' ' -f 1)" > resume-toolkit.tar.gz.sha256
          echo "ASSETS=$archive_name $archive_name.sha256 resume-toolkit.tar.gz resume-toolkit.tar.gz.sha256 release.ts release.ts.sha256" >> "$GITHUB_ENV"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" $ASSETS --generate-notes
